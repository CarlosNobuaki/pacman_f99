<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Multiplayer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Modal de Entrada -->
    <div id="modal-entrada" class="modal">
        <div class="modal-conteudo">
            <h1>F99 Team Multiplayer</h1>
            <p>Bem-vindo! Escolha seu avatar e entre no jogo.</p>
            
            <div class="form-grupo">
                <label for="nome-jogador">Seu Nome:</label>
                <input 
                    type="text" 
                    id="nome-jogador" 
                    placeholder="Digite seu nome" 
                    maxlength="20"
                    value="Jogador"
                >
            </div>
            
            <div class="form-grupo">
                <label>Escolha seu Avatar:</label>
                <div class="avatares">
                    <button class="avatar-btn" data-avatar="amarelo" style="background-color: #FFFF00; color: #000;">Amarelo</button>
                    <button class="avatar-btn" data-avatar="vermelho" style="background-color: #FF0000;">Vermelho</button>
                    <button class="avatar-btn" data-avatar="rosa" style="background-color: #FFB8FF;">Rosa</button>
                    <button class="avatar-btn" data-avatar="ciano" style="background-color: #00FFFF;">Ciano</button>
                    <button class="avatar-btn" data-avatar="laranja" style="background-color: #FFA500;">Laranja</button>
                </div>
            </div>
            
            <button id="btn-entrar" class="btn-primario">Entrar no Jogo</button>
            
            <div id="msg-erro" class="msg-erro"></div>
        </div>
    </div>
    
    <!-- HUD do Jogo -->
    <div id="hud" class="hud" style="display: none;">
        <div class="hud-esquerda">
            <span>Nível: 12</span>
        </div>
        <div class="hud-centro">
            <span>Jogadores Conectados: <span id="cont-jogadores">0</span>/5</span>
        </div>
        <div class="hud-direita">
            <button id="btn-sair" class="btn-secundario">Sair</button>
        </div>
    </div>
    
    <!-- Canvas do Jogo -->
    <canvas id="canvas-jogo" width="672" height="864"></canvas>
    
    <!-- Modal de Pausa/Game Over -->
    <div id="modal-pausa" class="modal" style="display: none;">
        <div class="modal-conteudo">
            <h2 id="titulo-pausa">Pausa</h2>
            <div id="stats-jogador" class="stats">
                <!-- Preenchido dinamicamente -->
            </div>
            <div id="leaderboard" class="leaderboard">
                <h3>🏆 Top Scores</h3>
                <div id="lista-scores"></div>
            </div>
            <button id="btn-continuar" class="btn-primario">Continuar</button>
            <button id="btn-nova-partida" class="btn-secundario">Nova Partida</button>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/client.js') }}"></script>
</body>
</html>
